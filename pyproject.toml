[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cy06"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "botocore[crt]>=1.43.92",
    "fastapi",
    "psycopg[binary]>=3.2",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]
